<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Slayer</title>
</head>
<body>
    <header>
        <h1> The real fight starts </h1>
        </header>
        <section class="gameContainer">
          
            
            <div class="maxScoreContainer">
                <label for="maxScore"></label>
            </div>
            <div class="ScoreDisplay">
                <!--- barre de vie-->
                <span id="player1Score">0</span> - <span id="player2Score">0</span>
            </div>
    
            <form class="playerSection">
                  <button id="AttackButton" class="ScoringButton" type="button">Attack</button>
                  <button id="SpecialAttackButton" class="ScoringButton" type="button">Special Attack</button>
                  <button id="Heal" class="ScoringButton" type="button">Heal</button>   
                  <button class="ResetButton" class="NewGame" type="button">Give up</button>
            </form>
        
    </section>
    
    <script src="/js/main.js"> </script>
    
</body>
</html>
